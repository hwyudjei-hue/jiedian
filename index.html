<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>公司首页</title>
    <style>
        /* 基本样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #f4f4f4;
            color: #333;
        }

        /* 页面头部 */
        header {
            background-color: #333;
            color: #fff;
            padding: 20px 0;
        }

        header .container {
            width: 90%;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header .logo {
            font-size: 24px;
            font-weight: bold;
        }

        header nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 20px;
            font-size: 18px;
            transition: color 0.3s;
        }

        header nav a:hover {
            color: #e74c3c;
        }

        /* 首页大图及内容 */
        .hero {
            background: url('https://via.placeholder.com/1600x600') no-repeat center center/cover;
            color: #fff;
            text-align: center;
            padding: 100px 20px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 20px;
            margin-bottom: 40px;
        }

        .hero .btn {
            padding: 10px 30px;
            background-color: #e74c3c;
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .hero .btn:hover {
            background-color: #c0392b;
        }

        /* 服务介绍区域 */
        .services {
            background-color: #fff;
            padding: 50px 20px;
            text-align: center;
        }

        .services h2 {
            font-size: 32px;
            margin-bottom: 30px;
        }

        .services .service-item {
            display: inline-block;
            width: 30%;
            margin: 0 10px;
            padding: 20px;
            background-color: #ecf0f1;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .services .service-item:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .services .service-item h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .services .service-item p {
            font-size: 16px;
        }

        /* 页脚 */
        footer {
            background-color: #333;
            color: #fff;
            padding: 20px 0;
            text-align: center;
        }

        footer p {
            font-size: 14px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .services .service-item {
                width: 100%;
                margin-bottom: 20px;
            }

            .hero h1 {
                font-size: 36px;
            }

            .hero p {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <!-- 页面头部 -->
    <header>
        <div class="container">
            <div class="logo">公司名称</div>
            <nav>
                <a href="#">首页</a>
                <a href="#">服务</a>
                <a href="#">关于我们</a>
                <a href="#">联系我们</a>
            </nav>
        </div>
    </header>

    <!-- 首页大图区域 -->
    <section class="hero">
        <h1>欢迎来到我们的网站</h1>
        <p>我们提供高质量的服务，帮助您实现业务目标</p>
        <a href="#services" class="btn">了解更多</a>
    </section>

    <!-- 服务介绍区域 -->
    <section class="services" id="services">
        <h2>我们的服务</h2>
        <div class="service-item">
            <h3>服务一</h3>
            <p>为您提供专业的解决方案，帮助您的公司发展壮大。</p>
        </div>
        <div class="service-item">
            <h3>服务二</h3>
            <p>全方位的技术支持，确保您的项目顺利进行。</p>
        </div>
        <div class="service-item">
            <h3>服务三</h3>
            <p>优质的客户服务，让您的体验更加完美。</p>
        </div>
    </section>

    <!-- 页脚 -->
    <footer>
        <p>&copy; 2025 公司名称. 版权所有。</p>
    </footer>

</body>
</html>
